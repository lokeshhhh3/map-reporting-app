# ===========================================================================
# Deploy to GitHub Pages
# ===========================================================================
# This file tells GitHub to build the website and publish it online EVERY TIME
# you push to the main branch. You do not need to run anything yourself.
#
# Where it goes:  https://<owner>.github.io/map-reporting-app/
#
# The repository is named "map-reporting-app".
# If that name ever changes, the "base" value in vite.config.js must be
# changed to match, or the published page loads with no styling and no map.
# ===========================================================================

name: Deploy to GitHub Pages

on:
  # Run every time something is pushed to the main branch
  push:
    branches: ['main']

  # Also allow running it by hand from the Actions tab on GitHub
  workflow_dispatch:

# Permissions the workflow needs to publish the site
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time. If you push twice quickly, the older run is
# cancelled instead of fighting with the newer one.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    steps:
      # 1. Download your repository onto the build machine
      - name: Checkout the code
        uses: actions/checkout@v7

      # 2. Install Node.js (the same runtime you have on your laptop)
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      # 3. Download the libraries. 'npm ci' is the strict version of
      #    'npm install' -- it installs exactly what package-lock.json says,
      #    so the online build matches your laptop.
      - name: Install dependencies
        run: npm ci

      # 4. Create the finished website in the dist/ folder
      #
      #    The Firebase settings are read from GitHub repository secrets.
      #    They are NOT in the code, so if you have not added them yet these
      #    are empty - and the site simply runs on the demo data. Nothing breaks.
      #
      #    To add them: repo -> Settings -> Secrets and variables -> Actions
      #    -> New repository secret. Use these exact names.
      - name: Build the site
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # 5. Prepare the built files for publishing
      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    name: Publish it online
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
